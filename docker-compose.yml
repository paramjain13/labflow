services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: labflow
      POSTGRES_PASSWORD: labflow
      POSTGRES_DB: labflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labflow -d labflow"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
